services:
  - type: web
    name: webscanner-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://ironclaudsecurity.vercel.app,https://iron-claud-security-webscanner.vercel.app,http://localhost:5173,http://127.0.0.1:5173